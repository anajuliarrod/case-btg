[project]
name = "case-btg"
version = "0.1.0"
description = "Agente code-first de extração e validação de avisos de eventos corporativos"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=2.32.0",
    "claude-agent-sdk>=0.2.171",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
case-btg = "case_btg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_btg"]
